# Publishes public/ to GitHub Pages.
# GitHub Pages serves from github.io, which is reachable in Egypt (unlike
# netlify.app). This is an alternative host to the Netlify deploy — both can
# run at once.
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". (Private repos need GitHub Pro; a public repo
# works on the free plan — this repo has no secrets in it, see config.js.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
